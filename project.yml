# Especificación XcodeGen. Regenera el proyecto con:  xcodegen generate
# El .xcodeproj generado también está en el repo para abrirlo sin XcodeGen.
name: PersonalLimits

options:
  bundleIdPrefix: com.ericmargay
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Elige tu equipo en Xcode (Signing & Capabilities) o escríbelo aquí.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0

targets:
  # ---------------------------------------------------------------- iOS app
  PersonalLimits:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericmargay.personallimits
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PersonalLimits.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: PersonalLimitsWidget
        embed: true
      - target: PersonalLimitsWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform

  # ------------------------------------------------------------- iOS widget
  PersonalLimitsWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericmargay.personallimits.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Personal Limits
        CODE_SIGN_ENTITLEMENTS: Widget/PersonalLimitsWidget.entitlements
        SKIP_INSTALL: YES

  # ------------------------------------------------------------ watchOS app
  PersonalLimitsWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared/AppConfig.swift
      - path: Shared/Models
      - path: Shared/Storage/SharedStore.swift
      - path: Shared/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericmargay.personallimits.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/PersonalLimitsWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    dependencies:
      - target: PersonalLimitsWatchWidget
        embed: true

  # -------------------------------------------- watchOS complications widget
  PersonalLimitsWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidget
      - path: Shared/AppConfig.swift
      - path: Shared/Models
      - path: Shared/Storage/SharedStore.swift
      - path: Shared/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericmargay.personallimits.watchkitapp.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WatchWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Personal Limits
        CODE_SIGN_ENTITLEMENTS: WatchWidget/PersonalLimitsWatchWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  PersonalLimits:
    build:
      targets:
        PersonalLimits: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  PersonalLimitsWatch:
    build:
      targets:
        PersonalLimitsWatch: all
    run:
      config: Debug
